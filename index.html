
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPlanner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes blink-overlap {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); background-color: #ef4444; color: white; border-color: #b91c1c; }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-blink-overlap {
            animation: blink-overlap 1.5s infinite ease-in-out;
        }
        @keyframes blink-pr {
            0% { opacity: 1; background-color: #ef4444; color: white; }
            50% { opacity: 0.5; background-color: #7f1d1d; color: #fca5a5; }
            100% { opacity: 1; background-color: #ef4444; color: white; }
        }
        .animate-pr-blink {
            animation: blink-pr 1s infinite ease-in-out;
        }
        
        /* Utilitaires de scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media print {
            body * { visibility: hidden; }
            #root, #root * { visibility: hidden; }
            .print-modal, .print-modal * { visibility: visible; }
            .print-modal {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
                visibility: visible;
            }
            /* Masquer les boutons d'action lors de l'impression */
            .no-print { display: none !important; }
        }
    </style>
<script type="importmap">
{

    "lucide-react": "https://esm.sh/lucide-react@0.344.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "jspdf": "https://esm.sh/jspdf@2.5.1"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
</body>
</html>
